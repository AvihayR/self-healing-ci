name: Setup workspace
description: Node, dependency cache and a clean install. The glue at the top of every job.

inputs:
  node-version:
    description: Node major version to install.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # `npm ci` rather than `npm install`: the lockfile is the input, and a job
    # that quietly resolves a different tree than the one committed makes the
    # dependency-drift breaks in the catalogue undiagnosable.
    - name: Install
      shell: bash
      run: npm ci

    # esbuild ships a platform binary from a postinstall script. npm 11 defers
    # unreviewed install scripts, and the root package.json's allowScripts entry
    # is what lets this one run — without the binary, `vite build` fails with an
    # error that names esbuild rather than the permission that blocked it.
    # `transformSync`, not `require`. esbuild resolves its platform binary
    # lazily on first use, so requiring the package succeeds even when the
    # binary is missing — a guard written that way passes in precisely the
    # situation it exists to catch. This invokes it for real.
    - name: Verify esbuild binary
      shell: bash
      run: node -e "require('esbuild').transformSync('const a = 1'); console.log('esbuild binary present')"
