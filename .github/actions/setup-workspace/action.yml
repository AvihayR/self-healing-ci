name: Setup workspace
description: Node, dependency cache and a clean install. The glue at the top of every job.

inputs:
  node-version:
    description: Node major version to install.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # `npm ci` rather than `npm install`: the lockfile is the input, and a job
    # that quietly resolves a different tree than the one committed makes the
    # dependency-drift breaks in the catalogue undiagnosable.
    - name: Install
      shell: bash
      run: npm ci
