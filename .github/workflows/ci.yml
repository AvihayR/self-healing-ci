name: CI

on:
  push:
    branches: [main]
  pull_request:

# The caller owns permissions. Read-only is all any of these jobs needs, and a
# reusable workflow can only narrow what it is given — so this line is the
# ceiling for everything CI does, stated in one place.
permissions:
  contents: read

# A force-push or a second push to the same PR makes the older run pointless.
# Cancel it rather than paying for a verdict on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/_node-ci.yml
    with:
      node-version: "22"
